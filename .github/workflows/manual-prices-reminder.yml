name: Manual prices reminder

# Monthly: open (or update) an issue listing hand-entered prices older than
# 60 days; close it once they're all current. With Issues turned off for the
# repository, the list goes in the run's summary instead.
on:
  schedule:
    - cron: "37 14 1 * *" # 1st of each month, 14:37 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: check
        run: npm run manual-prices:check -- --summary reminder.md
      - name: Open, update or close the reminder issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Manual prices to check
          STALE: ${{ steps.check.outputs.stale }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues)" != "true" ]; then
            cat reminder.md >> "$GITHUB_STEP_SUMMARY"
            if [ "$STALE" != "0" ]; then
              echo "::warning::$STALE hand-entered prices are over 60 days old (see the run summary). Turn on Issues to get a reminder issue."
            fi
            exit 0
          fi
          issue=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ "$STALE" != "0" ]; then
            if [ -n "$issue" ]; then gh issue edit "$issue" --body-file reminder.md
            else gh issue create --title "$TITLE" --body-file reminder.md; fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Every manual price has been checked in the last 60 days."
          fi
