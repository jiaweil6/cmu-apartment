name: Refresh transit data

# Weekly: route from every apartment to campus with OpenTripPlanner, using PRT's
# GTFS feed and an OpenStreetMap extract. Clean results go live; big changes or
# routing failures open a PR for review.
on:
  schedule:
    - cron: "17 9 * * 1" # Mondays, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: data-writes

jobs:
  transit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/opentripplanner

      - name: Refresh commute and walking distance
        id: refresh
        run: npm run refresh -- --only transit --gtfs-dir otp-run/gtfs --summary refresh-summary.md

      - uses: ./.github/actions/publish-data
        with:
          paths: data/snapshot.json
          commit-message: Refresh commute and walking distance
          needs-review: ${{ steps.refresh.outputs.needs_review }}
          pr-branch: data/refresh-transit
          pr-title: Review commute and walking distance changes
          pr-body-path: refresh-summary.md

      - name: Show OpenTripPlanner log
        if: failure()
        run: tail -n 100 otp-run/server.log || true
      - if: failure()
        uses: ./.github/actions/report-status
        with:
          status: failure
      - if: success()
        uses: ./.github/actions/report-status
        with:
          status: success
