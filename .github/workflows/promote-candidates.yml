name: Promote reviewed apartments

# After a "Weekly apartment finds" PR merges: list approved buildings, remember
# rejected ones, and keep pending ones for later. Fails (listing what to fill in)
# if an approved building is missing required details.
on:
  push:
    branches: [main]
    paths: [data/candidates.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-candidates

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run candidates:promote
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || { git commit -m "List reviewed apartments" && git push; }
