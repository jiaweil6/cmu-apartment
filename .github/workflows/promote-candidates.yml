name: Promote reviewed apartments

# After a "Weekly apartment finds" PR merges: list approved buildings, remember
# rejected ones, and keep pending ones for later. Fails (listing what to fill in)
# if an approved building is missing required details.
on:
  push:
    branches: [main]
    paths: [data/candidates.json]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: data-writes

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run candidates:promote

      # A person already reviewed these decisions, so they always commit.
      - uses: ./.github/actions/publish-data
        with:
          paths: data/
          commit-message: List reviewed apartments

      - if: failure()
        uses: ./.github/actions/report-status
        with:
          status: failure
      - if: success()
        uses: ./.github/actions/report-status
        with:
          status: success
