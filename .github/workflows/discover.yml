name: Discover apartments

# Weekly: find apartment buildings near campus that aren't listed yet and open a
# "Weekly apartment finds" PR. Reviewers approve or reject them in that PR;
# promote-candidates.yml applies the decisions after it merges.
on:
  schedule:
    - cron: "41 10 * * 3" # Wednesdays, 10:41 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: discover

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # Updating an open PR would overwrite the reviewer's edits, so wait for it to be merged or closed.
      - name: Check for finds still in review
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh pr list --head data/discover --state open --json number --jq length)
          echo "open=$open" >> "$GITHUB_OUTPUT"
          if [ "$open" != "0" ]; then echo "::notice::Last week's apartment finds are still in review; skipping."; fi

      - if: steps.review.outputs.open == '0'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - if: steps.review.outputs.open == '0'
        run: npm ci
      - if: steps.review.outputs.open == '0'
        uses: ./.github/actions/opentripplanner

      - name: Discover apartment buildings
        if: steps.review.outputs.open == '0'
        env:
          # Optional: looks up websites for new finds. Without it, reviewers fill them in.
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: >
          npm run discover -- --otp-url http://localhost:8080 --gtfs-dir otp-run/gtfs
          --summary discover-summary.md

      - name: Open pull request
        if: steps.review.outputs.open == '0'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/discover
          add-paths: data/candidates.json
          commit-message: Add apartment buildings found this week
          title: Weekly apartment finds
          body-path: discover-summary.md

      - if: failure()
        uses: ./.github/actions/report-status
        with:
          status: failure
      - if: success()
        uses: ./.github/actions/report-status
        with:
          status: success
