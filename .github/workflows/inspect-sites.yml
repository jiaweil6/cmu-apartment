name: Inspect building websites

# Temporary: surveys listing websites so price scrapers can be written, then
# commits the report to the feature branch. Delete once the survey is done.
on:
  push:
    branches: [claude/eloquent-clarke-du30hy]
    paths: [".github/workflows/inspect-sites.yml", "scripts/inspect-sites/**"]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: rm -rf scripts/refresh/__fixtures__/sites
      - run: npx tsx scripts/inspect-sites/index.ts
      - name: Commit report to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add scripts/refresh/__fixtures__/sites
          git diff --cached --quiet || { git commit -m "Update building website survey" && git push; }
