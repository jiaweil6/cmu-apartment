name: Inspect building websites

# On demand: survey every listing's website (robots.txt, leasing platform,
# rent-like JSON, pricing pages) to help write a price scraper for a building.
# The report is uploaded as an artifact; see docs/data-sources.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsx scripts/inspect-sites/index.ts
      - uses: actions/upload-artifact@v4
        with:
          name: site-survey
          path: scripts/refresh/__fixtures__/sites
